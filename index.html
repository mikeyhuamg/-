<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>糖豆大暴走</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
:root{--ink:#263050;--pink:#ff5f8f;--yellow:#ffe66d;--blue:#53c7ed;--mint:#69dfb6}
*{box-sizing:border-box}body{margin:0;background:#a9e9fb;color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;overflow:hidden}#game{display:block;width:100vw;height:100vh;background:linear-gradient(#8fe0f5 0%,#c9f4ff 66%,#71d9b4 66%,#4ac99e 100%)}
.hud{position:fixed;inset:15px 18px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.panel{background:#fffdf2eF;border:3px solid #fff;border-radius:18px;padding:10px 16px;box-shadow:0 5px 0 #33416525;font-weight:900}.brand{font-size:20px;color:#f04c7f}.small{font-size:13px;font-weight:700}.lives{font-size:25px;letter-spacing:3px;color:#ff5685}.right{display:flex;gap:10px;text-align:center}.pill{min-width:95px}.pill strong{display:block;font-size:19px}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;background:#fffdf2e8;border-radius:15px;padding:8px 16px;font-weight:700;font-size:13px;text-align:center}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#2330525c}.card{width:min(520px,90vw);padding:30px;background:#fffdf2;border:5px solid white;border-radius:28px;text-align:center;box-shadow:0 10px 0 #26305035}.card h1{font-size:38px;margin:0;color:#f04c7f}.card p{line-height:1.8}.card button{border:0;border-radius:16px;background:#ff5f8f;color:white;font:900 20px inherit;padding:12px 28px;box-shadow:0 5px #c9436b;cursor:pointer}.card button:active{transform:translateY(4px);box-shadow:0 1px #c9436b}.hidden{display:none}
</style></head><body>
<canvas id="game"></canvas>
<div class="hud"><div class="panel"><div class="brand">🍬 糖豆大暴走</div><div class="small">果凍轉轉橋 · 關卡 1</div><div class="lives" id="lives">♥ ♥ ♥</div></div><div class="right"><div class="panel pill">時間<strong id="time">60.0</strong></div><div class="panel pill">檢查點<strong id="checkpoint">未抵達</strong></div></div></div>
<div class="bottom">移動 WASD／方向鍵　跳躍 Space　衝刺 Shift　|　收集護盾糖果可擋一次傷害</div>
<div class="overlay" id="overlay"><div class="card"><h1 id="title">糖豆大暴走！</h1><p id="message">穿越旋轉橋、躲開糖果槌，再跳過果凍地板！<br>你有三條命，抵達終點就能過關。</p><button id="start">開始闖關</button></div></div>
<script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),ui={lives:document.querySelector('#lives'),time:document.querySelector('#time'),cp:document.querySelector('#checkpoint'),overlay:document.querySelector('#overlay'),title:document.querySelector('#title'),msg:document.querySelector('#message'),start:document.querySelector('#start')};let W,H,scale=1,keys={},running=false,last=0,t=0,time=60,life=3,shield=false,cp=0,player={x:0,y:0,vx:0,vy:0,r:17,on:false,stun:0},finishX=0,camera=0,hammerHit=0;const world={ground:[[0,560,470],[590,560,450],[1140,560,420],[1660,560,450]],platforms:[[520,512,100,20],[1055,485,85,20],[1570,500,90,20]],bridges:[{x:435,y:470,w:195,h:22,a:0},{x:850,y:465,w:235,h:22,a:0},{x:1285,y:470,w:300,h:22,a:0}],holes:[[470,620],[1040,1140],[1560,1660]],checkpointX:1135,end:2070};finishX=world.end;
function resize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);scale=Math.min(W/1050,H/650)}addEventListener('resize',resize);resize();
function reset(){time=60;life=3;shield=false;cp=0;camera=0;player={x:80,y:500,vx:0,vy:0,r:17,on:false,stun:0};ui.cp.textContent='未抵達';running=true;ui.overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function lose(){if(shield){shield=false;return}life--;if(life<=0){end(false,'三條命都用完了，再挑戰一次吧！');return}player.x=cp?world.checkpointX:80;player.y=500;player.vx=player.vy=0;player.stun=.65}
function end(win,msg){running=false;ui.title.textContent=win?'闖關成功！🎉':'再接再厲！';ui.msg.innerHTML=msg+'<br>'+ (win?'你成功穿越果凍轉轉橋！':'用三條命再試一次，一定能到終點！');ui.start.textContent='再玩一次';ui.overlay.classList.remove('hidden')}
ui.start.onclick=reset;addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
function platformAt(x,y){for(const [px,py,w,h] of world.platforms)if(x>px&&x<px+w&&y>=py-6&&y<=py+h+8)return py;for(const b of world.bridges){const bx=b.x+b.w/2,by=b.y+Math.sin(t*1.7+b.x*.01)*18;if(x>bx-b.w/2&&x<bx+b.w/2&&y>=by-6&&y<=by+26)return by}for(const [gx,gy,w] of world.ground)if(x>gx&&x<gx+w&&y>=gy-8)return gy;return null}
function update(dt){t+=dt;time-=dt;if(time<=0){time=0;end(false,'時間到了！');return}if(player.stun>0)player.stun-=dt;else{let ax=0;if(keys.ArrowRight||keys.KeyD)ax++;if(keys.ArrowLeft||keys.KeyA)ax--;let max=(keys.ShiftLeft||keys.ShiftRight)?350:245;player.vx+=ax*1050*dt;player.vx*=Math.pow(ax?0.86:0.72,dt*60);player.vx=Math.max(-max,Math.min(max,player.vx));if((keys.Space||keys.ArrowUp||keys.KeyW)&&player.on){player.vy=-520;player.on=false}if((keys.ShiftLeft||keys.ShiftRight)&&!player.dash){player.vx+=(player.vx>=0?1:-1)*95;player.dash=true}if(!(keys.ShiftLeft||keys.ShiftRight))player.dash=false}
player.vy+=1150*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;player.on=false;let py=platformAt(player.x,player.y+player.r);if(py!==null&&player.vy>=0){player.y=py-player.r;player.vy=0;player.on=true}if(player.y>H/scale+120||player.x<0){lose()}if(player.x>world.checkpointX&&!cp){cp=1;ui.cp.textContent='已啟用 ✓'}
// Rotating candy mallets
for(const [hx,hy,range,phase] of [[710,438,78,0],[1210,438,84,2.1],[1720,438,82,4]]){let angle=Math.sin(t*2.1+phase)*.9;let ex=hx+Math.sin(angle)*range,ey=hy+Math.cos(angle)*range;if(Math.hypot(player.x-ex,player.y-ey)<player.r+23&&hammerHit<=0){hammerHit=.8;player.vx=(player.x-ex>0?1:-1)*290;player.vy=-350;lose()}}hammerHit=Math.max(0,hammerHit-dt);
if(player.x>world.end){end(true,'剩餘時間 '+time.toFixed(1)+' 秒。');return}camera=Math.max(0,Math.min(world.end-W/scale+130,player.x-W/scale*.32));ui.lives.textContent='♥ '.repeat(life).trim()+'♡ '.repeat(3-life);ui.time.textContent=time.toFixed(1)}
function draw(){ctx.clearRect(0,0,W,H);let s=Math.min(W/1050,H/650);ctx.save();ctx.scale(s,s);let vw=W/s,vh=H/s;camera=Math.max(0,Math.min(world.end-vw+70,player.x-vw*.32));ctx.translate(-camera,0); // distant clouds
for(let i=0;i<8;i++){let x=(i*300+70)%(world.end+250);ctx.fillStyle='#ffffff99';ctx.beginPath();ctx.ellipse(x,110+(i%3)*58,42,17,0,0,Math.PI*2);ctx.ellipse(x+28,104+(i%3)*58,29,20,0,0,Math.PI*2);ctx.fill()}
// floor/void
ctx.fillStyle='#46c99c';ctx.fillRect(camera,vh*.66,world.end+400,vh*.34);for(let [x,y,w] of world.ground){round(x,y,w,vh-y,'#51d5a3',12);ctx.fillStyle='#ffe66d';ctx.fillRect(x,y,w,8)}
for(let [x,y,w,h] of world.platforms){round(x,y,w,h,'#ff9dbc',10);ctx.fillStyle='#fff';ctx.fillRect(x+10,y+5,w-20,4)}
for(const b of world.bridges){let y=b.y+Math.sin(t*1.7+b.x*.01)*18;ctx.save();ctx.translate(b.x+b.w/2,y);ctx.rotate(Math.sin(t*2+b.x*.01)*.13);round(-b.w/2,-10,b.w,20,'#ffc955',10);for(let x=-b.w/2+18;x<b.w/2;x+=35){ctx.fillStyle='#fff4c5';ctx.beginPath();ctx.arc(x,0,4,0,7);ctx.fill()}ctx.restore()}
// mallets
for(const [hx,hy,range,phase] of [[710,438,78,0],[1210,438,84,2.1],[1720,438,82,4]]){let angle=Math.sin(t*2.1+phase)*.9,ex=hx+Math.sin(angle)*range,ey=hy+Math.cos(angle)*range;ctx.strokeStyle='#9a5bb0';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(ex,ey);ctx.stroke();ctx.fillStyle='#ff5f8f';ctx.beginPath();ctx.arc(ex,ey,23,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex-7,ey-5,4,0,7);ctx.arc(ex+7,ey-5,4,0,7);ctx.fill()}
// candy shield collectible
let candyX=1370,candyY=400+Math.sin(t*3)*10;if(!shield&&player.x<1400){ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(candyX,candyY,15,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(candyX-13,candyY);ctx.lineTo(candyX+13,candyY);ctx.stroke()}if(!shield&&Math.hypot(player.x-candyX,player.y-candyY)<30)shield=true;
// finish
ctx.fillStyle='#fff';ctx.fillRect(world.end,330,12,230);ctx.fillStyle='#ff5f8f';ctx.fillRect(world.end-35,330,95,38);ctx.fillStyle='#fff';ctx.font='900 18px sans-serif';ctx.fillText('終點',world.end-25,356);ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.moveTo(world.end+6,315);ctx.lineTo(world.end+24,330);ctx.lineTo(world.end+6,345);ctx.lineTo(world.end-12,330);ctx.fill();
// player shadow and bean
ctx.fillStyle='#1c836d55';ctx.beginPath();ctx.ellipse(player.x,player.y+player.r+4,player.r*1.15,5,0,0,7);ctx.fill();ctx.fillStyle='#ff5f8f';ctx.beginPath();ctx.ellipse(player.x,player.y,player.r*.9,player.r*1.05,0,0,7);ctx.fill();if(shield){ctx.strokeStyle='#ffe66d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(player.x,player.y,player.r+8,0,7);ctx.stroke()}ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(player.x-5,player.y-3,4,5,0,0,7);ctx.ellipse(player.x+6,player.y-3,4,5,0,0,7);ctx.fill();ctx.fillStyle='#34405f';ctx.beginPath();ctx.arc(player.x-4,player.y-3,1.8,0,7);ctx.arc(player.x+7,player.y-3,1.8,0,7);ctx.fill();ctx.restore();
// progress bar
let pw=Math.min(260,W-40),px=W/2-pw/2;ctx.fillStyle='#fff9';round(px,18,pw,9,9,'#fff9',6);round(px,18,pw*Math.min(1,player.x/world.end),9,9,'#ff5f8f',6)}function round(x,y,w,h,color,r){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,Math.max(1,w),Math.max(1,h),r);ctx.fill()}
function loop(now){if(!running)return;let dt=Math.min(.032,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}draw();})();
</script></body></html>
